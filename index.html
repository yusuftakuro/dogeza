<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f1e9">
<title>DOGEZA — FORM IS EVERYTHING.</title>
<link rel="stylesheet" href="style.css?v=r2">
</head>
<body>
<div id="app">
  <section class="screen active" id="titleScreen">
    <div class="microTop"><span>01 / FORM STUDY</span><span class="muted">PORTRAIT SYSTEM</span></div>
    <div class="titleBlock"><h1>DOGEZA</h1><div class="tag">FORM IS EVERYTHING.</div></div>
    <div class="titleFigureWrap" id="titleFigureWrap">
      <svg id="titleFigure" viewBox="0 0 360 250" aria-hidden="true"></svg>
      <div class="titleScan"></div>
    </div>
    <div class="titleBottom"><span class="tap">TAP TO BEGIN</span><span class="best" id="bestLabel">BEST —</span></div>
  </section>

  <section class="screen" id="gameScreen">
    <div id="stage">
      <div class="microTop"><span id="runCode">FORM / 000</span><span class="muted" id="statusCode">READY</span></div>
      <div class="telemetry" id="telemetry"><i class="v"></i><i class="v"></i><i class="v"></i><i class="h"></i><i class="h"></i><i class="h"></i></div>
      <svg id="figureSvg" viewBox="0 0 360 560" aria-hidden="true">
        <line id="floorLine" x1="28" x2="332" y1="486" y2="486"></line>
        <g class="far" id="farBody"></g>
        <g id="nearBody"></g>
        <g id="analysisLayer"></g>
      </svg>
      <div id="eyesLayer">
        <div class="eyeField" id="eyeField">
          <div class="focusRing r3"></div><div class="focusRing r2"></div><div class="focusRing r1"></div>
          <div class="focusAxis x"></div><div class="focusAxis y"></div><div class="focusVectors"></div>
          <div class="eyeOutline left"><div class="iris"><div class="ghost"></div></div></div>
          <div class="eyeOutline right"><div class="iris"><div class="ghost"></div></div></div>
        </div>
        <div class="eyeReadout"><span>OCULAR CONVERGENCE</span><span id="eyeReadout">Δ —</span></div>
      </div>
      <div class="telemetryPanel" id="telemetryPanel">
        <div class="metric"><span id="m1Label">ANGLE</span><b id="m1Value">—</b></div>
        <div class="metric right"><span id="m2Label">VELOCITY</span><b id="m2Value">—</b></div>
      </div>
      <div class="cue" id="cue"></div>
      <div id="transitionMask"></div>
    </div>
  </section>

  <section class="screen" id="resultScreen">
    <div class="resultWrap">
      <div class="microTop"><span>FORM ANALYSIS / FINAL</span><span class="muted" id="bestResult"></span></div>
      <div class="totalLabel">TOTAL FORM INDEX</div>
      <div class="totalScore" id="totalScore">00.00</div>
      <div class="verdict" id="verdict"></div>
      <div class="phaseSummary" id="phaseSummary">
        <div class="phaseRow"><span>KNEES</span><span id="sumKnees">—</span></div>
        <div class="phaseRow"><span>HEAD</span><span id="sumHead">—</span></div>
        <div class="phaseRow"><span>EYES</span><span id="sumEyes">—</span></div>
      </div>
      <div class="resultHint" id="resultHint"></div>
    </div>
    <div class="details" id="details">
      <h2>FORM ANALYSIS</h2>
      <div id="detailContent"></div>
      <div class="resultHint">TAP TO CLOSE</div>
    </div>
    <div id="perfectWord">DOGEZA.</div>
  </section>
</div>
<div id="landscape">PORTRAIT REQUIRED.</div>
<script src="app.js?v=r2"></script>
</body>
</html>
